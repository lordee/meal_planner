name: Build Home Assistant Add-on

on:
  push:
    branches: [ "main" ]
    paths:
      - 'meal_planner/config.yaml' # Trigger only when the specific config changes
  workflow_dispatch: 

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/meal-planner

jobs:
  tag:
    name: Auto-tag version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.check_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: get_version
        run: |
          # Pointing directly to your subdirectory file
          CONFIG_PATH="meal_planner/config.yaml"
          
          if [ ! -f "$CONFIG_PATH" ]; then
            echo "Error: $CONFIG_PATH not found!"
            exit 1
          fi

          # Extract version and strip any surrounding quotes or spaces
          VERSION=$(grep '^version:' "$CONFIG_PATH" | sed 's/version: //; s/"//g; s/ //g')
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract version from $CONFIG_PATH"
            exit 1
          fi
          
          echo "Found version $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check and push tag
        id: check_tag
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping tagging."
          else
            echo "Creating new tag $VERSION"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  init:
    name: Initialize build
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@master
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: [tag, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.new_tag }}

      - name: Build image
        uses: home-assistant/builder/actions/build-image@master
        with:
          arch: ${{ matrix.arch }}
          context: meal_planner  # Directing build context to the subdirectory
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.tag.outputs.new_tag }}
            latest
          push: true
          version: ${{ needs.tag.outputs.new_tag }}

  manifest:
    name: Publish multi-arch manifest
    needs: [tag, init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@master
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.tag.outputs.new_tag }}
            latest